[general]

import = ["local.toml"]

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#404040"
blue = "#87afdf"
cyan = "#00ffff"
green = "#00ff00"
magenta = "#ff00ff"
red = "#ff0000"
white = "#ffffff"
yellow = "#ffff00"

[colors.normal]
black = "#000000"
blue = "#5f87b7"
cyan = "#00cdcd"
green = "#00cd00"
magenta = "#cd00cd"
red = "#cd0000"
white = "#faebd7"
yellow = "#cdcd00"

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[font]
# size = 11.25 # Overriden in local.toml

[font.normal]
family = "DejaVuSansM Nerd Font"

[window]
dynamic_title = true
opacity = 0.8
